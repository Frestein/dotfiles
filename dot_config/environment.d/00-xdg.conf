export XDG_CACHE_HOME="${XDG_CACHE_HOME:-$HOME/.cache}"
export XDG_CONFIG_HOME="${XDG_CONFIG_HOME:-$HOME/.config}"
export XDG_DATA_HOME="${XDG_DATA_HOME:-$HOME/.local/share}"
export XDG_RUNTIME_DIR="${XDG_RUNTIME_DIR:-/run/user/$UID}"
export XDG_STATE_HOME="${XDG_STATE_HOME:-$HOME/.local/state}"

export BUN_HOME="$XDG_DATA_HOME/bun"
export CARGO_HOME="$XDG_DATA_HOME/cargo"
export RUSTUP_HOME="$XDG_DATA_HOME/rustup"
export GOPATH="$XDG_DATA_HOME/go"
export WINEPREFIX="$XDG_DATA_HOME/wine"
export PYTHONSTARTUP="$XDG_CONFIG_HOME/python/pythonrc"
export _JAVA_OPTIONS=-Djava.util.prefs.userRoot="$XDG_CONFIG_HOME/java"
export NUGET_PACKAGES="$XDG_CACHE_HOME/NuGetPackages"
export DOTNET_CLI_HOME="$XDG_DATA_HOME/dotnet"
export RENPY_PATH_TO_SAVES="$XDG_DATA_HOME/renpy"
export CUPS_CONFIG_DIR="$XDG_CONFIG_HOME/cups"
export CUPS_CACHE_DIR="$XDG_CACHE_HOME/cups"
export CUPS_DATA_DIR="$XDG_DATA_HOME/cups"
export RLWRAP_HOME="$XDG_DATA_HOME/rlwrap"
export NPM_CONFIG_USERCONFIG="$XDG_CONFIG_HOME/npm/npmrc"
export GNUPGHOME="$XDG_DATA_HOME/gnupg"
export SSH_AUTH_SOCK="$XDG_RUNTIME_DIR/ssh-agent.socket"
export PASSWORD_STORE_DIR="$XDG_DATA_HOME/gopass/stores/root"
export SCREENRC="$XDG_CONFIG_HOME/screen/screenrc"
export EMACSDIR="$XDG_CONFIG_HOME/emacs"

export PATH="$BUN_HOME/bin:$GOPATH/bin:$CARGO_HOME/bin:$XDG_CONFIG_HOME/emacs/bin:$HOME/.local/bin:$PATH"
