-- ===========================================================================
-- Conky Configuration
-- ===========================================================================

conky.config = {
	-- Various settings
	background = false, -- forked to background
	cpu_avg_samples = 2, -- The number of samples to average for CPU monitoring.
	diskio_avg_samples = 10, -- The number of samples to average for disk I/O monitoring.
	double_buffer = false, -- Use the Xdbe extension? (eliminates flicker)
	if_up_strictness = "address", -- how strict if testing interface is up - up, link or address
	net_avg_samples = 2, -- The number of samples to average for net data
	no_buffers = true, -- Subtract (file system) buffers from used memory?
	temperature_unit = "celsius", -- fahrenheit or celsius
	text_buffer_size = 2048, -- size of buffer for display of content of large variables - default 256
	update_interval = 1.0, -- update interval
	imlib_cache_size = 0, -- disable image cache to get a new spotify cover per song
	extra_newline = false,
	show_graph_range = false,
	show_graph_scale = false,

	-- Placement
	alignment = "top_right", -- top_left,top_middle,top_right,bottom_left,bottom_middle,bottom_right,
	gap_x = 15, -- pixels between right or left border
	gap_y = 15, -- pixels between bottom or left border

	-- Size
	minimum_height = 200, -- minimum height of window
	minimum_width = 260, -- minimum width of window
	maximum_width = 260, -- maximum width of window

	-- Graphical
	border_inner_margin = 5, -- margin between border and text
	border_outer_margin = 5, -- margin between border and edge of window
	border_width = 0, -- border width in pixels
	default_bar_width = 260, -- default is 0 - full width
	default_bar_height = 10, -- default is 6
	default_gauge_height = 25, -- default is 25
	default_gauge_width = 40, -- default is 40
	default_graph_height = 40, -- default is 25
	default_graph_width = 153, -- default is 0 - full width
	default_shade_color = "#000000", -- default shading colour
	default_outline_color = "#000000", -- default outline colour
	draw_borders = false, -- draw borders around text
	draw_graph_borders = true, -- draw borders around graphs
	draw_outline = false, -- draw outline
	draw_shades = false, -- draw shades
	stippled_borders = 0, -- dashing the border

	-- Textual
	format_human_readable = true, -- KiB, MiB rather then number of bytes
	font = "Source Code Pro:bold:size=10", -- the default font used
	font2 = "Raleway:bold:size=30", -- font for the time
	font3 = "Ubuntu:size=14", -- font for the date
	font4 = "Raleway:bold:size=9", -- font for the keybindings heading
	max_text_width = 0, -- 0 will make sure line does not get broken if width too smal
	max_user_text = 16384, -- max text in conky default 16384
	override_utf8_locale = true, -- force UTF8 requires xft
	short_units = true, -- shorten units from KiB to k
	top_name_width = 21, -- width for $top name value default 15
	top_name_verbose = false, -- If true, top name shows the full command line of  each  process - Default value is false.
	uppercase = false, -- uppercase or not
	use_spacer = "none", -- adds spaces around certain objects to align - default none
	use_xft = true, -- xft font - anti-aliased font
	xftalpha = 1, -- alpha of the xft font - between 0-1

	-- Windows
	own_window = true, -- create your own window to draw
	own_window_argb_value = 255, -- real transparency - composite manager required 0-255
	own_window_argb_visual = true, -- use ARGB - composite manager required
	own_window_class = "Conky", -- manually set the WM_CLASS name for use with xprop
	own_window_colour = "#282828", -- set colour if own_window_transparent no
	own_window_transparent = false, -- if own_window_argb_visual is true sets background opacity 0%
	own_window_title = "hyprland_conky", -- set the name manually
	own_window_type = "override", -- if own_window true options are: normal/override/dock/desktop/panel
	own_window_hints = "undecorated,below,above,sticky,skip_taskbar,skip_pager", -- if own_window true - just hints - own_window_type sets it

	-- Out
	out_to_console = false,
	out_to_ncurses = false,
	out_to_stderr = false,
	out_to_wayland = true,
	out_to_x = false,

	-- Colors (Gruvbox Dark)
	color0 = "#928374",
	color1 = "#cc241d",
	color2 = "#b8bb26",
	color3 = "#fabd2f",
	color4 = "#458588",
	color5 = "#b16286",
	color6 = "#8ec07c",
	color7 = "#ebdbb2",
}

-- ===========================================================================
-- Text Sections
-- ===========================================================================

local time_section = [[
${alignc}${color2}${font2}${time %I:%M}${font}
${voffset 6}${alignc}${color3}${font3}${time %b %d, %Y}${font}${color}
]]

local cpu_section = [[
${color2}CPU ${cpu}%
${color4}${cpubar 8,260}
${voffset 5}${color7}${top name 1}${alignr}${color}${top cpu 1}%
${color7}${top name 2}${alignr}${color}${top cpu 2}%
${color7}${top name 3}${alignr}${color}${top cpu 3}%
]]

local ram_section = [[
${color2}RAM $mem/$memmax
${color4}${membar 8,260}${color}
${voffset 5}${color7}${top_mem name 1}${alignr}${color}${top_mem mem_res 1}
${color7}${top_mem name 2}${alignr}${color}${top_mem mem_res 2}
${color7}${top_mem name 3}${alignr}${color}${top_mem mem_res 3}
]]

local fs_section = [[
${color2}File systems${color}
${voffset 5}/ ${alignr}${color}${fs_used /}/${fs_size /} (${fs_free /})
${color4}${fs_bar 8,260 /}${color}
/home ${alignr}${color}${fs_used /home}/${fs_size /home} (${fs_free /home})
${color4}${fs_bar 8,260 /home}${color}
/mnt/sda ${alignr}${color}${fs_used /mnt/sda}/${fs_size /mnt/sda} (${fs_free /mnt/sda})
${color4}${fs_bar 8,260 /mnt/sda}${color}
]]

local keybindings_section = [[
${color7}${alignc}${font4}HYPRLAND KEYBINDINGS${font}${color}
${color7}${hr}${color}
${color7}[S]+[RET]${alignr}${color2}foot${color}
${color7}[S]+q${alignr}${color2}qutebrowser${color}
${color7}[S]+Q${alignr}${color2}firefox${color}
${color7}[S]+h/j/k/l${alignr}${color2}move focus${color}
${color7}[S]+c, [S]+c${alignr}${color2}close window${color}
${color7}[S]+[1-9]${alignr}${color2}workspaces${color}
${color7}[S]+[SHIFT]+[1-9]${alignr}${color2}send window${color}
${color7}${hr}${color}
${color7}[S]+x ${alignr}${color2}clipboard${color}
${color7}[S]+a, w${alignr}${color2}windows${color}
${color7}[S]+a, q${alignr}${color2}session${color}
${color7}[S]+a, S${alignr}${color2}services${color}
${color7}[S]+a, z${alignr}${color2}pass${color}
${color7}[S]+a, r${alignr}${color2}asroot${color}
${color7}${hr}${color}
${color7}[S]+e, e${alignr}${color2}emacs${color}
${color7}[S]+e, E${alignr}${color2}eshell${color}
${color7}[S]+e, s${alignr}${color2}vterm${color}
${color7}[S]+e, a${alignr}${color2}agenda${color}
${color7}[S]+e, c${alignr}${color2}capture${color}
${color7}[S]+e, m${alignr}${color2}mu4e${color}
${color7}[S]+e, b${alignr}${color2}ebuku${color}
${color7}[S]+e, n${alignr}${color2}elfeed${color}
${color7}[S]+e, t${alignr}${color2}telega${color}
${color7}[S]+e, d${alignr}${color2}dired${color}
${color7}[S]+e, i${alignr}${color2}ibuffer${color}
${color7}[S]+e, T${alignr}${color2}trashed${color}
${color7}[S]+e, p${alignr}${color2}pass${color}
${color7}${hr}${color}
${color7}[S]+d, t${alignr}${color2}toggle monocle${color}
${color7}[S]+d, r${alignr}${color2}reload session${color}
${color7}[S]+d, l${alignr}${color2}lock session${color}
${color7}[S]+d, q${alignr}${color2}quit session${color}
]]

-- ===========================================================================
-- Dynamic Block Assembly
-- ===========================================================================

local blocks = {
	{ text = cpu_section, voffset = 18 },
	{ text = ram_section, voffset = 14 },
	{ text = fs_section, voffset = 14 },
}

local filtered = {}
for _, b in ipairs(blocks) do
	local txt = b.text
	if txt and txt ~= "" then
		table.insert(filtered, b)
	end
end

local final_text = ""
for i, b in ipairs(filtered) do
	if i > 1 then
		final_text = final_text .. "${voffset " .. b.voffset .. "}"
	end
	final_text = final_text .. b.text
end

conky.text = final_text

