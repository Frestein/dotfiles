monitor.alsa.rules = [
  {
    matches = [
      { node.name = "alsa_output.pci-0000_00_1f.3.analog-stereo" },
      { node.name = "alsa_input.pci-0000_00_1f.3.analog-stereo" }
    ]
    actions = {
      update-props = {
        node.description = "PC"
      }
    }
  }
  {
    matches = [
      { node.name = "alsa_output.pci-0000_01_00.1.hdmi-stereo-extra3" }
    ]
    actions = {
      update-props = {
        node.description = "Monitor"
      }
    }
  }
]
