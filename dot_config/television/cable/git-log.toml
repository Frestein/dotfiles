[metadata]
name = "git-log"
description = "A channel to select from git log entries"
requirements = ["git", "bash"]

[source]
command = "bash -c 'git log --oneline --date=short --pretty=\"format:%h %s %an %cd\" \"$@\"'"
output = "{split: :0}"

[preview]
command = "bash -c 'git show -p --stat --pretty=fuller --color=always \"{0}\"'"
