[metadata]
name = "git-branch"
description = "A channel to select from git branches"
requirements = ["git", "bash"]

[source]
command = "bash -c 'git --no-pager branch --all --format=\"%(refname:short)\"'"
output = "{split: :0}"

[preview]
command = "bash -c 'git show -p --stat --pretty=fuller --color=always \"{0}\"'"
