enable_selector = true
selector = "fuzzel -d -p 'Open with ' --placeholder='Choose...' --minimal-lines"
term_exec_args = ""
expand_wildcards = false

[[handlers]]
exec = "umpv %u"
terminal = false
regexes = ['^https?://(www\.)?youtube\.com/watch\?.*v=']

[[handlers]]
exec = "umpv %u"
terminal = false
regexes = ['^https?://youtu\.be/.*']

[[handlers]]
exec = "sh -c 'url=%u; if command -v curl >/dev/null 2>&1; then swayimg \"exec://curl -so- \"$url\"\"; else swayimg \"exec://wget -qO- \"$url\"\"; fi'"
terminal = false
regexes = ['^https?://images\.steamusercontent\.com/ugc/\d+/[A-Za-z0-9]+/?$']

[[handlers]]
exec = "git_handler %u"
terminal = false
regexes = ['^git\+https://']

[[handlers]]
exec = "/usr/bin/qutebrowser %u"
terminal = false
regexes = ["^https?://"]
