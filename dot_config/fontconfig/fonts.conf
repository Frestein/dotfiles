<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<fontconfig>
    <match target="pattern">
        <test qual="any" name="family"><string>emoji</string></test>
        <edit name="family" mode="prepend" binding="strong"><string>JoyPixels</string></edit>
        <edit name="family" mode="append"><string>Noto Sans</string></edit>
    </match>
    <match target="pattern">
        <test name="family"><string>sans</string></test>
        <edit name="family" mode="append"><string>JoyPixels</string></edit>
        <edit name="family" mode="append"><string>Noto Serif</string></edit>
    </match>
    <match target="pattern">
        <test name="family"><string>serif</string></test>
        <edit name="family" mode="append"><string>JoyPixels</string></edit>
        <edit name="family" mode="append"><string>Noto Serif</string></edit>
    </match>
    <match target="pattern">
        <test name="family"><string>sans-serif</string></test>
        <edit name="family" mode="append"><string>JoyPixels</string></edit>
        <edit name="family" mode="append"><string>Noto Sans</string></edit>
    </match>
    <match target="pattern">
        <test name="family" qual="any"><string>monospace</string></test>
        <edit name="family" mode="prepend" binding="strong"><string>Maple Mono NF</string></edit>
        <edit name="family" mode="append" binding="strong"><string>JetBrainsMono Nerd Font</string></edit>
        <edit name="family" mode="append"><string>JoyPixels</string></edit>
    </match>
    <match target="pattern">
        <test name="family" qual="any"><string>Apple Color Emoji</string></test>
        <edit name="family" mode="assign" binding="same"><string>JoyPixels</string></edit>
        <edit name="family" mode="append"><string>Noto Sans</string></edit>
    </match>
    <match target="pattern">
        <test name="family" qual="any"><string>Segoe UI Emoji</string></test>
        <edit name="family" mode="assign" binding="same"><string>JoyPixels</string></edit>
        <edit name="family" mode="append"><string>Noto Sans</string></edit>
    </match>
    <match target="pattern">
        <test name="family" qual="any"><string>Segoe UI Symbol</string></test>
        <edit name="family" mode="assign" binding="same"><string>JoyPixels</string></edit>
        <edit name="family" mode="append"><string>Noto Sans</string></edit>
    </match>
    <match target="pattern">
        <test name="family" qual="any"><string>Android Emoji</string></test>
        <edit name="family" mode="assign" binding="same"><string>JoyPixels</string></edit>
        <edit name="family" mode="append"><string>Noto Sans</string></edit>
    </match>
    <match target="pattern">
        <test name="family" qual="any"><string>Twitter Color Emoji</string></test>
        <edit name="family" mode="assign" binding="same"><string>JoyPixels</string></edit>
        <edit name="family" mode="append"><string>Noto Sans</string></edit>
    </match>
    <match target="pattern">
        <test name="family" qual="any"><string>Twemoji</string></test>
        <edit name="family" mode="assign" binding="same"><string>JoyPixels</string></edit>
        <edit name="family" mode="append"><string>Noto Sans</string></edit>
    </match>
    <match target="pattern">
        <test name="family" qual="any"><string>Twemoji Mozilla</string></test>
        <edit name="family" mode="assign" binding="same"><string>JoyPixels</string></edit>
        <edit name="family" mode="append"><string>Noto Sans</string></edit>
    </match>
    <match target="pattern">
        <test name="family" qual="any"><string>TwemojiMozilla</string></test>
        <edit name="family" mode="assign" binding="same"><string>JoyPixels</string></edit>
        <edit name="family" mode="append"><string>Noto Sans</string></edit>
    </match>
    <match target="pattern">
        <test name="family" qual="any"><string>EmojiTwo</string></test>
        <edit name="family" mode="assign" binding="same"><string>JoyPixels</string></edit>
        <edit name="family" mode="append"><string>Noto Sans</string></edit>
    </match>
    <match target="pattern">
        <test name="family" qual="any"><string>Emoji Two</string></test>
        <edit name="family" mode="assign" binding="same"><string>JoyPixels</string></edit>
        <edit name="family" mode="append"><string>Noto Sans</string></edit>
    </match>
    <match target="pattern">
        <test name="family" qual="any"><string>EmojiSymbols</string></test>
        <edit name="family" mode="assign" binding="same"><string>JoyPixels</string></edit>
        <edit name="family" mode="append"><string>Noto Sans</string></edit>
    </match>
    <match target="pattern">
        <test name="family" qual="any"><string>Symbola</string></test>
        <edit name="family" mode="assign" binding="same"><string>JoyPixels</string></edit>
        <edit name="family" mode="append"><string>Noto Sans</string></edit>
    </match>
</fontconfig>
