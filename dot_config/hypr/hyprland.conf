source = $XDG_CONFIG_HOME/hypr/themes/gruvbox-dark.conf
source = $XDG_CONFIG_HOME/hypr/autostart.conf
source = $XDG_CONFIG_HOME/hypr/rules.conf
source = $XDG_CONFIG_HOME/hypr/binds.conf

monitor = ,preferred,auto,1

general { 
    gaps_in                   = 0
    gaps_out                  = 0
    border_size               = 2
    col.active_border         = $activeBorder
    col.inactive_border       = $inactiveBorder
    col.nogroup_border_active = $activeBorder
    col.nogroup_border        = $inactiveBorder

    resize_on_border    = true 

    allow_tearing = false

    layout = dwindle
}

group {
    col.border_active          = $groupActiveBorder
    col.border_inactive        = $groupInactiveBorder
    col.border_locked_active   = $groupLockedActiveBorder
    col.border_locked_inactive = $groupLockedInactiveBorder

    groupbar {
        font_size = 10

        col.active = $groupBarActiveBorder
        col.inactive = $groupBarInactiveBorder
        col.locked_active = $groupBarLockedActiveBorder
        col.locked_inactive = $groupBarLockedInactiveBorder
    }
}

decoration {
    rounding = 0

    active_opacity   = 1.0
    inactive_opacity = 1.0

	shadow {
		enabled      = true
		range        = 4
		render_power = 3
		color        = rgba(1a1a1aee)
	}

    blur {
        enabled  = true
        size     = 3
        passes   = 1
        vibrancy = 0.1696
    }
}

animations {
    enabled = false

    bezier = easeOutQuint,   0.23, 1,    0.32, 1
    bezier = easeInOutCubic, 0.65, 0.05, 0.36, 1
    bezier = linear,         0,    0,    1,    1
    bezier = almostLinear,   0.5,  0.5,  0.75, 1.0
    bezier = quick,          0.15, 0,    0.1,  1

    animation = windows,       1, 4.79, easeOutQuint
    animation = windowsIn,     1, 4.1,  easeOutQuint, popin 87%
    animation = windowsOut,    1, 1.49, linear,       popin 87%
    animation = fadeIn,        1, 1.73, almostLinear
    animation = fadeOut,       1, 1.46, almostLinear
    animation = fade,          1, 3.03, quick
    animation = layers,        1, 3.81, easeOutQuint
    animation = layersIn,      1, 4,    easeOutQuint, fade
    animation = layersOut,     1, 1.5,  linear,       fade
    animation = fadeLayersIn,  1, 1.79, almostLinear
    animation = fadeLayersOut, 1, 1.39, almostLinear
    animation = workspaces,    1, 1.94, almostLinear, fade
    animation = workspacesIn,  1, 1.21, almostLinear, fade
    animation = workspacesOut, 1, 1.94, almostLinear, fade
}

dwindle {
    pseudotile     = true
    preserve_split = true
}

master {
    new_status = master
}

misc { 
    font_family = "Maple Mono NF"

    force_default_wallpaper = -1
    disable_hyprland_logo   = false

    enable_swallow = true
    swallow_regex = ^(kitty|foot|footclient|footclient-yazi|footclient-yt)$
}

input {
    kb_layout    = us,ru
    kb_variant   = ,
    kb_model     = pc104
    kb_options   = grp:win_space_toggle
    kb_rules     =

    follow_mouse = 1

    sensitivity  = -1.0

    touchpad {
        natural_scroll = false
    }
}

device {
    name = kanata
    repeat_delay = 250
}

cursor {
    inactive_timeout = 5
}

gestures {
    workspace_swipe = false
}

binds {
    workspace_back_and_forth = true
    allow_workspace_cycles   = true
}

ecosystem {
    no_update_news = true
    no_donation_nag = true
}
