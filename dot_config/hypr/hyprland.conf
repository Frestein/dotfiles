source = $XDG_CONFIG_HOME/hypr/autostart.conf
source = $XDG_CONFIG_HOME/hypr/rules.conf
source = $XDG_CONFIG_HOME/hypr/binds.conf
source = $XDG_CONFIG_HOME/hypr/themes/gruvbox-dark.conf

monitor = ,preferred,auto,1

general { 
    # I didn’t fucking pay for pixels to sit idle
    gaps_in                   = 0
    gaps_out                  = 0

    # Border
    resize_on_border          = true
    border_size               = 2
    col.active_border         = $activeBorder
    col.inactive_border       = $inactiveBorder
    col.nogroup_border_active = $activeBorder
    col.nogroup_border        = $inactiveBorder
}

dwindle {
    preserve_split = true
}

# FIX: Broken after rewriting groups in Hyprland
group {
    col.border_active          = $groupActiveBorder
    col.border_inactive        = $groupInactiveBorder
    col.border_locked_active   = $groupLockedActiveBorder
    col.border_locked_inactive = $groupLockedInactiveBorder
    groupbar {
        font_size = 10
        col.active = $groupBarActiveBorder
        col.inactive = $groupBarInactiveBorder
        col.locked_active = $groupBarLockedActiveBorder
        col.locked_inactive = $groupBarLockedInactiveBorder
    }
}

input {
    # My keyboard setup
    kb_layout    = us,ru
    kb_variant   = ,
    kb_model     = pc104
    kb_options   = grp:win_space_toggle
    kb_rules     =

    sensitivity  = -1.0

    # Fast scroll on mid mouse button that works everywhere
    scroll_method = on_button_down
    scroll_button = 274
}

cursor {
    # Good addition for my work-first focus
    inactive_timeout = 5
}

binds {
    # Alt-Tab
    allow_workspace_cycles = true
}

# Useless shit for cool kiddies
animations {
    enabled = false
}

ecosystem {
    # IDGAF
    no_update_news = true
    no_donation_nag = true
}

misc {
    # Fuck you, I prefer womans with big boobas and thicc thighs
    disable_splash_rendering = true
    disable_hyprland_logo    = true

    # Almost a killer feature, but still shit
    enable_swallow = true
    swallow_regex = ^(foot.*)$
}

device {
    name = kanata
    repeat_delay = 250
}
