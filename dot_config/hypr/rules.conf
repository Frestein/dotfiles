#######################
#     LAYER RULES     #
#######################

layerrule {
  name = color-picker
  match:class = hyprpicker

  no_anim = 1
}

layerrule {
  name = screenshot-selection
  match:class = selection

  no_anim = 1
}

#####################
#     TAG RULES     #
#####################

windowrule = tag +tile, match:class Timeshift-gtk

windowrule = tile 1, match:tag tile

windowrule = tag +float, match:title .*float.*
windowrule = tag +float, match:title ee-footclient
windowrule = tag +float, match:title ^(emacs-capture)$
windowrule = tag +float, match:title ^(Please choose a folder)$
windowrule = tag +float, match:title ^(Find file.*)$
windowrule = tag +float, match:class ^(firefox)$, match:title ^(Save.*)$
windowrule = tag +float, match:class ^(firefox)$, match:title ^(Enter name of file.*)$
windowrule = tag +float, match:class ^(firefox)$, match:title (^$)
windowrule = tag +float, match:class zenity
windowrule = tag +float, match:class nm-connection-editor, match:title (^ $)
windowrule = tag +float, match:class org.qbittorrent.qBittorrent, match:title ^(Preferences|Open Torrent Files|Download from URLs|About qBittorrent|Torrent Creator|Manage Cookies)
windowrule = tag +float, match:class gcr-prompter
windowrule = tag +float, match:class polkit-gnome-authentication-agent-1
windowrule = tag +float, match:class steam, match:title ^(Friends List|Список друзей|Steam Settings|Настройки|Добавить стороннюю игру|Настройки раздела|Сведения о системе|Системный отчёт|Среда выполнения Steam — сведения о системе)$
windowrule = tag +float, match:class steam, match:title (^$)

windowrule = float 1, match:tag float

windowrule = tag +center, match:title .*center.*
windowrule = tag +center, match:title ee-footclient
windowrule = tag +center, match:title ^(emacs-capture)$
windowrule = tag +center, match:title ^(Please choose a folder)$
windowrule = tag +center, match:title ^(Find file.*)$
windowrule = tag +center, match:class Timeshift-gtk
windowrule = tag +center, match:class ^(firefox)$, match:title ^(Save.*)$
windowrule = tag +center, match:class ^(firefox)$, match:title ^(Enter name of file.*)$
windowrule = tag +center, match:class ^(firefox)$, match:title (^$)
windowrule = tag +center, match:class zenity
windowrule = tag +center, match:class nm-connection-editor, match:title (^ $)
windowrule = tag +center, match:class org.qbittorrent.qBittorrent, match:title ^(Preferences|Open Torrent Files|Download from URLs|About qBittorrent|Torrent Creator|Manage Cookies)
windowrule = tag +center, match:class gcr-prompter
windowrule = tag +center, match:class polkit-gnome-authentication-agent-1
windowrule = tag +center, match:class steam, match:title ^(Friends List|Список друзей|Steam Settings|Настройки|Добавить стороннюю игру|Настройки раздела|Сведения о системе|Системный отчёт|Среда выполнения Steam — сведения о системе)$

windowrule = center 1, match:tag center

windowrule = tag +half-size, match:title .*half.*
windowrule = tag +half-size, match:title ee-footclient
windowrule = tag +half-size, match:title ^(emacs-capture)$
windowrule = tag +half-size, match:title ^(Please choose a folder)$
windowrule = tag +half-size, match:title ^(Find file.*)$
windowrule = tag +half-size, match:class ^(firefox)$, match:title ^(Save.*)$
windowrule = tag +half-size, match:class ^(firefox)$, match:title ^(Enter name of file.*)$
windowrule = tag +half-size, match:class ^(firefox)$, match:title (^$)
windowrule = tag +half-size, match:class zenity
windowrule = tag +half-size, match:class org.qbittorrent.qBittorrent, match:title ^(Preferences|Open Torrent Files|Download from URLs|About qBittorrent|Torrent Creator|Manage Cookies)
windowrule = tag +half-size, match:class steam, match:title ^(Friends List|Список друзей|Steam Settings|Настройки|Добавить стороннюю игру|Настройки раздела|Сведения о системе|Системный отчёт|Среда выполнения Steam — сведения о системе)$

windowrule = size (monitor_w*0.5) (monitor_h*0.5), match:tag half-size

windowrule = size (monitor_w*0.75) (monitor_h*0.75), match:tag three-quarters-size

windowrule = tag +stay-focus, match:class ^(firefox)$, match:title (^$)

windowrule = stay_focused 1, match:tag stay-focus

########################
#     WINDOW RULES     #
########################

windowrule {
  name = suppress-maximize
  match:title = .*

  suppress_event = maximize
}

# War Thunder
windowrule {
    name = warthunder-fullscreen
    match:class = ^(Loading...)$

    fullscreen = 1
}

# INFO: Tabbed alternative. Bullshit.
