###########################
#     WORKSPACE RULES     #
###########################

windowrule {
    name = game-workspace
    match:class = ^(net.lutris.Lutris|steam)$

    workspace = 6 silent
}

windowrule {
    name = smart-gaps
    match:workspace = w[tv1]

    border_size = 0
    float = 0
}

windowrule {
    name = smart-gaps
    match:workspace = f[1]

    border_size = 0
    float = 0
}
