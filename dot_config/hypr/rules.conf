# windowrule = group deny, class:^(foot.*|nvim)$

###########################
#     WORKSPACE RULES     #
###########################

windowrule {
    name = game-workspace
    match:class = ^(net.lutris.Lutris|steam)$

    workspace = 6 silent
}

windowrule = border_size 0, match:float 0, match:workspace w[tv1]
windowrule = border_size 0, match:float 0, match:workspace f[1]
