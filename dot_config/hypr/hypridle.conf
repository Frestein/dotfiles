general {
    lock_cmd = pidof hyprlock || $XDG_CONFIG_HOME/hypr/scripts/screenlock.sh
    before_sleep_cmd = loginctl lock-session
    after_sleep_cmd = $XDG_CONFIG_HOME/hypr/scripts/screenon.sh
}

listener {
    timeout = 600
    on-timeout = loginctl lock-session
}

listener {
    timeout = 660
    on-timeout = $XDG_CONFIG_HOME/hypr/scripts/screenoff.sh
    on-resume = $XDG_CONFIG_HOME/hypr/scripts/screenon.sh
}
