# Apps
$emacs             = emacsclient -nc
$nvim              = uwsm app -- neovide
$browser           = uwsm app -- $BROWSER
$discord           = uwsm app -- discord
$music             = uwsm app -- youtube-music --enable-features=WebRTCPipeWireCapturer --ozone-platform-hint=auto
$telegram          = uwsm app -- AyuGram
$audio             = uwsm app -- pavucontrol & jamesdsp

# Terminal
$terminal          = footclient
$calc              = footclient -T 'footclient-center-half-float-calc' qalc
$top               = footclient -T 'footclient-center-half-float-top' btm -b --hide_avg_cpu
$yazi              = footclient -T 'footclient-center-half-float-yazi' yazi
$youtube           = footclient -T 'footclient-center-half-float-yt' yt-x

# Dmenu
$menu              = fuzzel -p ' ' -l 8
$clipManager       = cliphist-fuzzel-img
$pass              = tessen

# systemctl
$scu               = systemctl --user
$sc                = systemctl

# Scripts
$toggleBar         = pkill -USR1 waybar
$reloadBar         = $scu reload waybar
$restartBar        = $scu restart waybar
$lockBar           = bash -lc 'LOCK="/run/user/$(id -u)/waybar-autohide.lock"; [[ -f "$LOCK" ]] && rm -f "$LOCK" || touch "$LOCK"'; pkill -SIGRTMIN+8 waybar
$asroot            = $XDG_CONFIG_HOME/hypr/scripts/fuzzel/asroot.sh
$bluelight         = $XDG_CONFIG_HOME/hypr/scripts/bluelight.sh
$brightness        = $XDG_CONFIG_HOME/hypr/scripts/brightness.sh
$brightnessPicker  = $XDG_CONFIG_HOME/hypr/scripts/fuzzel/brightness.sh
$colorpicker       = $XDG_CONFIG_HOME/hypr/scripts/colorpicker.sh
$downloader        = $XDG_CONFIG_HOME/hypr/scripts/fuzzel/downloader.sh
$emoji             = $XDG_CONFIG_HOME/hypr/scripts/fuzzel/emoji.sh
$killactive        = $XDG_CONFIG_HOME/hypr/scripts/killactive.sh
$runner            = $XDG_CONFIG_HOME/hypr/scripts/fuzzel/drun.sh
$files             = dmenu_extended_run --no-settings
$sessionManager    = $XDG_CONFIG_HOME/hypr/scripts/fuzzel/sessionmanager.sh
$volume            = $XDG_CONFIG_HOME/hypr/scripts/volume.sh
$jamesdsp          = $XDG_CONFIG_HOME/hypr/scripts/jamesdsp.sh
$windows           = $XDG_CONFIG_HOME/hypr/scripts/fuzzel/windows.sh
$closeSpecial      = $XDG_CONFIG_HOME/hypr/scripts/close_special.sh

# Hyprland
$screenlock        = hyprlock
$reload            = hyprctl reload & $reloadBar & $scu reload mako
$enLayout          = hyprctl switchxkblayout kanata 0
$resetSubmap       = hyprctl dispatch submap reset

# Apps
bind = SUPER, RETURN,       exec, $terminal
bind = ,      XF86HomePage, exec, $browser
bind = SHIFT,      XF86HomePage, exec, firefox
bind = SUPER, Q,            exec, $browser
bind = SUPER  SHIFT,        Q,    exec, firefox

# Editor
# bind   = ALT SHIFT, E, exec, $emacs -e "(emacs-everywhere)"
bind   = SUPER, E, submap, editor
submap = editor

bind = ,      V, exec, $resetSubmap && $nvim
bind = ,      E, exec, $resetSubmap && $emacs
bind = SHIFT, E, exec, $resetSubmap && $emacs -e "(eshell \"γνῶθι σεαυτόν\")"
bind = ,      A, exec, $resetSubmap && $emacs -e "(org-todo-list)"
bind = ,      B, exec, $resetSubmap && $emacs -e "(ebuku)"
bind = ,      N, exec, $resetSubmap && $emacs -e "(frestein/elfeed-open-and-update)"
bind = ,      T, exec, $resetSubmap && $emacs -e "(telega)"
bind = SHIFT, T, exec, $resetSubmap && $emacs -e "(trashed)"
bind = ,      I, exec, $resetSubmap && $emacs -e "(ibuffer)"
bind = ,      D, exec, $resetSubmap && $emacs -e "(dirvish)"
bind = ,      S, exec, $resetSubmap && $emacs -e "(vterm)"
bind = ,      P, exec, $resetSubmap && $emacs -e "(pass)"
bind =      , R, exec, $resetSubmap && $scu reload emacs.service
bind = SHIFT, R, exec, $resetSubmap && $scu restart emacs.service

bind   = SUPER, E,      submap, reset
bind   = ,      ESCAPE, submap, reset
submap = reset

# Scratchpad
bind = , XF86Explorer,   togglespecialworkspace, yazi
bind = , XF86Tools,      togglespecialworkspace, music
bind = , XF86Calculator, togglespecialworkspace, calc

bind   = SUPER, S, submap, scratchpad
submap = scratchpad

bind = ,      R, exec, $resetSubmap && hyprctl dispatch togglespecialworkspace music
bind = ,      T, exec, $resetSubmap && hyprctl dispatch togglespecialworkspace telegram
bind = ,      D, exec, $resetSubmap && hyprctl dispatch togglespecialworkspace discord
bind = ,      Y, exec, $resetSubmap && hyprctl dispatch togglespecialworkspace youtube
bind = ,      F, exec, $resetSubmap && hyprctl dispatch togglespecialworkspace yazi
bind = ,      A, exec, $resetSubmap && hyprctl dispatch togglespecialworkspace audio
bind = ,      C, exec, $resetSubmap && hyprctl dispatch togglespecialworkspace calc
bind = SHIFT, T, exec, $resetSubmap && hyprctl dispatch togglespecialworkspace top

bind   = SUPER, S,      submap, reset
bind   = ,      ESCAPE, submap, reset
submap = reset

workspace = special:music,    on-created-empty:$music
workspace = special:telegram, on-created-empty:$telegram
workspace = special:discord,  on-created-empty:$discord
workspace = special:yazi,     on-created-empty:$yazi
workspace = special:calc,     on-created-empty:$calc
workspace = special:youtube,  on-created-empty:$youtube
workspace = special:audio,    on-created-empty:$audio
workspace = special:top,      on-created-empty:$top

# Applets
bind = CTRL,  F1, exec, pkill fuzzel || ($enLayout && $menu)
bind = SUPER, X,  exec, pkill fuzzel || ($enLayout && $clipManager)

bind   = SUPER, A, submap, applets
submap = applets

bind = ,      Z, exec, $resetSubmap && ($enLayout && $pass)
bind = ,      F, exec, $resetSubmap && ($enLayout && $files)
bind = ,      B, exec, $resetSubmap && $brightnessPicker
bind = ,      R, exec, $resetSubmap && ($enLayout && $runner)
bind = SHIFT, R, exec, $resetSubmap && ($enLayout && $asroot)
bind = ,      W, exec, $resetSubmap && ($enLayout && $windows)
bind = ,      Q, exec, $resetSubmap && ($enLayout && $sessionManager)
bind = ,      D, exec, $resetSubmap && ($enLayout && $downloader)

bind   = , E, submap, emoji
submap = emoji

bind = , E, exec, $resetSubmap && ($enLayout && $emoji "😃 " emoji)
bind = , N, exec, $resetSubmap && ($enLayout && $emoji " " nerd_font)
bind = , M, exec, $resetSubmap && ($enLayout && $emoji "Math " math)
bind = , W, exec, $resetSubmap && ($enLayout && $emoji "Writer " latin-1_supplement math)

bind   = , E,      submap, reset
bind   = , ESCAPE, submap, reset
submap = applets

bind   = SUPER, A,      submap, reset
bind   = ,      ESCAPE, submap, reset
submap = reset

# Bar
bind   = SUPER, T, submap, bar
submap = bar

bind = ,      T, exec, $resetSubmap && $toggleBar
bind = SHIFT, T, exec, $resetSubmap && $lockBar
bind = ,      R, exec, $resetSubmap && $reloadBar
bind = SHIFT, R, exec, $resetSubmap && $restartBar
bind = ,      L, exec, $resetSubmap && $lockBar

bind   = SUPER, T,      submap, reset
bind   = ,      ESCAPE, submap, reset
submap = reset

# Hyprland
bind   = ALT SHIFT, H, submap, hyprland
submap = hyprland

bindl = , Q, exec, $resetSubmap && uwsm stop
bind  = , L, exec, $resetSubmap && $screenlock
bind  = , R, exec, $resetSubmap && $reload

bind   = ALT SHIFT, H,      submap, reset
bind   = ,          ESCAPE, submap, reset
submap = reset

# Windows
bind = ALT    SHIFT, F,    togglefloating,
bind = ALT    SHIFT, S,    togglesplit,
bind = ALT    SHIFT, P,    pseudo,
bind = SUPER, F,     fullscreen,
bind = SUPER, C,     exec, $killactive

bindm = SUPER, mouse:272, movewindow
bindm = SUPER, mouse:273, resizewindow

bind = SUPER, H, movefocus, l
bind = SUPER, J, movefocus, d
bind = SUPER, K, movefocus, u
bind = SUPER, L, movefocus, r

bind   = SUPER, W, submap, window
submap = window

binde = , LEFT,  resizeactive, -50 0
binde = , DOWN,  resizeactive, 0   50
binde = , UP,    resizeactive, 0   -50
binde = , RIGHT, resizeactive, 50  0

binde = , H, moveactive, -50 0
binde = , K, moveactive, 0   -50
binde = , J, moveactive, 0   50
binde = , L, moveactive, 50  0

bind   = SUPER, W,      submap, reset
bind   = ,      ESCAPE, submap, reset 
submap = reset

# Workspaces
bind = SUPER, 1, exec, $closeSpecial
bind = SUPER, 2, exec, $closeSpecial
bind = SUPER, 3, exec, $closeSpecial
bind = SUPER, 4, exec, $closeSpecial
bind = SUPER, 5, exec, $closeSpecial
bind = SUPER, 6, exec, $closeSpecial
bind = SUPER, 7, exec, $closeSpecial
bind = SUPER, 8, exec, $closeSpecial
bind = SUPER, 9, exec, $closeSpecial
bind = SUPER, 0, exec, $closeSpecial

bind = SUPER, 1, workspace, 1
bind = SUPER, 2, workspace, 2
bind = SUPER, 3, workspace, 3
bind = SUPER, 4, workspace, 4
bind = SUPER, 5, workspace, 5
bind = SUPER, 6, workspace, 6
bind = SUPER, 7, workspace, 7
bind = SUPER, 8, workspace, 8
bind = SUPER, 9, workspace, 9
bind = SUPER, 0, workspace, 10

bind = ALT, TAB, exec, $closeSpecial

bind = ALT, TAB, workspace, previous

bind = SUPER SHIFT, 1, movetoworkspace, 1
bind = SUPER SHIFT, 2, movetoworkspace, 2
bind = SUPER SHIFT, 3, movetoworkspace, 3
bind = SUPER SHIFT, 4, movetoworkspace, 4
bind = SUPER SHIFT, 5, movetoworkspace, 5
bind = SUPER SHIFT, 6, movetoworkspace, 6
bind = SUPER SHIFT, 7, movetoworkspace, 7
bind = SUPER SHIFT, 8, movetoworkspace, 8
bind = SUPER SHIFT, 9, movetoworkspace, 9
bind = SUPER SHIFT, 0, movetoworkspace, 10

bind = ALT, mouse_up,   workspace,  e+1
bind = ALT, mouse_down, workspace,  e-1
bind = ALT  SHIFT,      mouse_down, changegroupactive, b
bind = ALT  SHIFT,      mouse_up,   changegroupactive, f

# Groups
bind   = SUPER, G, submap, group
submap = group

bind  = ,      T, togglegroup,
bind  = ,      L, lockactivegroup,   toggle
binde = SHIFT, J, changegroupactive, b
binde = SHIFT, K, changegroupactive, f

bind   = SUPER, G,      submap, reset
bind   = ,      ESCAPE, submap, reset
submap = reset

# Wallpaper
bind = SUPER ALT, R, exec, waypaper --random

# MPRIS
bindl = , XF86AudioNext, exec, playerctl next
bindl = , XF86AudioPrev, exec, playerctl previous
bindl = , XF86AudioPlay, exec, playerctl play-pause
bindl = , XF86AudioStop, exec, playerctl stop

bindl = ALT,  mouse:276, exec, playerctl next
bindl = ALT,  mouse:275, exec, playerctl previous
bindl = CTRL, mouse:276, exec, playerctl play-pause
bindl = CTRL, mouse:275, exec, playerctl stop

# PipeWire
bindel = , XF86AudioRaiseVolume, exec, $volume --inc
bindel = , XF86AudioLowerVolume, exec, $volume --dec
bindl  = , XF86AudioMute,        exec, $volume --toggle

# JamesDSP
bind   = SUPER, V, submap, jamesdsp
submap = jamesdsp

bind = , T,  exec, $resetSubmap && $jamesdsp --toggle
bind = , S,  exec, $resetSubmap && $jamesdsp --state
bind = , C,  exec, $resetSubmap && $jamesdsp --choose-preset

bind   = SUPER, V,      submap, reset
bind   = ,      ESCAPE, submap, reset
submap = reset

# Brightness
bindel = SUPER ALT, G, exec, $brightness --inc
bindel = SUPER ALT, H, exec, $brightness --dec

# Bluelight
bindl = SUPER ALT, B, exec, $bluelight

# Colorpicker
bind = SUPER, P, exec, $colorpicker

# Screencapture
bind   = SUPER, R, submap, record
submap = record

bind = ,      O,  exec, $resetSubmap && gsr-ui-cli toggle-show
bind = ,      P,  exec, $resetSubmap && gsr-ui-cli toggle-pause
bind = CTRL,  S,  exec, $resetSubmap && gsr-ui-cli replay-save
bind = ,      R,  exec, $resetSubmap && gsr-ui-cli toggle-record
bind = SHIFT, R,  exec, $resetSubmap && gsr-ui-cli toggle-replay
bind = ,      S,  exec, $resetSubmap && gsr-ui-cli toggle-stream
bind = ,      F1, exec, $resetSubmap && gsr-ui-cli toggle-show
bind = ,      F2, exec, $resetSubmap && gsr-ui-cli toggle-pause
bind = ,      F3, exec, $resetSubmap && gsr-ui-cli replay-save
bind = ,      F4, exec, $resetSubmap && gsr-ui-cli toggle-record
bind = ,      F5, exec, $resetSubmap && gsr-ui-cli toggle-replay
bind = ,      F6, exec, $resetSubmap && gsr-ui-cli toggle-stream

bind   = SUPER, R,      submap, reset
bind   = ,      ESCAPE, submap, reset
submap = reset

# Screenshot
bind   = , PRINT, exec, screenshot

# Zoom
bind   = SUPER, Z, submap, zoom
submap = zoom

bind  = , mouse_down, exec, hyprctl -q keyword cursor:zoom_factor $(hyprctl getoption cursor:zoom_factor | awk '/^float.*/ {print $2 * 1.1}')
bind  = , mouse_up,   exec, hyprctl -q keyword cursor:zoom_factor $(hyprctl getoption cursor:zoom_factor | awk '/^float.*/ {print $2 * 0.9}')
binde = , Z,          exec, hyprctl -q keyword cursor:zoom_factor $(hyprctl getoption cursor:zoom_factor | awk '/^float.*/ {print $2 * 1.1}')
binde = , X,          exec, hyprctl -q keyword cursor:zoom_factor $(hyprctl getoption cursor:zoom_factor | awk '/^float.*/ {print $2 * 0.9}')
bind  = , C,          exec, hyprctl -q keyword cursor:zoom_factor 1
binde = , UP,         exec, hyprctl -q keyword cursor:zoom_factor $(hyprctl getoption cursor:zoom_factor | awk '/^float.*/ {print $2 * 1.1}')
binde = , DOWN,       exec, hyprctl -q keyword cursor:zoom_factor $(hyprctl getoption cursor:zoom_factor | awk '/^float.*/ {print $2 * 0.9}')
bind  = , 0,          exec, hyprctl -q keyword cursor:zoom_factor 1

bind   = SUPER, Z,      submap, reset
bind   = ,      ESCAPE, submap, reset
submap = reset
