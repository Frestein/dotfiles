default_install_hook_types: [commit-msg]

repos:
  - repo: https://github.com/compilerla/conventional-pre-commit
    rev: v4.5.0
    hooks:
      - id: conventional-pre-commit
        stages: [commit-msg]
        args:
          - --force-scope
          - --scopes=acb,agenda,ai.supermaven,aliases,android,arch,arch-update,aria2,arkenfox,askpass,asroot,atuin,authinfo,auth-source,bash,bin,bottom,brightnessctl,brush,btop,buku,calfw,chezmoi,chezmoi-watcher,chromium,cliphist,clipmanager,common-lisp,compile-angel,conky,consult-gh,corfu,cups,delta,dired,dirvish,discord,dmenu,dmenu-ex,doas,downloadctl,ebuku,eglot,elfeed,elfeed-org,emacs,ement,enchant,eshell,everywhere,eww,fastfetch,ff,firefox,fish,fj,flow,flycheck,fontconfig,fonts,foot,fuzzel,fzf,ghostel,git,gitu,gnupg,gosuki,gpg-agent,gpu-screen-recorder,gsr,handlr,helix,hypridle,hyprland,hyprlock,hyprpaper,hyprtoolkit,ianny,isync,jamesdsp,jinx,kanata,kanata-switcher,kanata-swtcher,kitty,kvantum,lang.commonlisp,lazygit,LICENSE,magit,magit-todos,mako,mangohud,mime,mimeapps,mpv,msmtp,mu4e,neovide,newsboat,nm-dmenu,nord,nvchecker,nvim,nyxt,oh-my-posh,omp,opencode,org,org-agenda,org-contacts,org-roam,org-srs,osm,packages,pacman,pdf-tools,pear,pipewire,profile,pulse,qalc,qs,qt6ct,quickshell,qutebrowser,qute-buku,reverse-im,rofimoji,satty,sbcl,screen,screenshot,scripts,sessionctl,shell,sudo,swayimg,symex,systemd,telega,television,termfilechooser,tessen,trashed,tridactyl,tv,typst,udiskie,uosc,uwsm,vterm,waybar,waypaper,wluma,wt,xdg,xonsh,xremap,yarn,yay,yazi,yt-dlp,yt-dlp-plugins,ytm,yt-x,zathura,zoxide,zsh
