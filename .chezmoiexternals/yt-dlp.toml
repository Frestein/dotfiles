stripComponents = 1
refreshPeriod = "168h"
include = ["*/yt_dlp_plugins/**"]

[".config/yt-dlp-plugins/bgutil-ytdlp-pot-provider"]
type = "archive"
url = "https://github.com/Brainicism/bgutil-ytdlp-pot-provider/archive/master.tar.gz"
exact = true
stripComponents = 2
refreshPeriod = "168h"
include = ["*/plugin/yt_dlp_plugins/**"]

["Tools/bgutil-ytdlp-pot-provider"]
