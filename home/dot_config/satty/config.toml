[general]
# Start Satty in fullscreen mode: true, "all" or "current-screen".
# "all" covers all screens, "current-screen" only the current one; behavior may depend on the compositor.
fullscreen = "current-screen"

# Resize the window initially: { mode = "smart" } or { mode = "size", width = 2000, height = 800 }.
resize = { mode = "smart" }

# Try to have the window float. This may depend on the compositor.
floating-hack = true
# Request no window decoration; the compositor has the final say. Requires xdg-decoration-unstable-v1.
no-window-decoration = true
# Hide toolbars by default.
default-hide-toolbars = false
# Whether window focus shows/hides toolbars (does not affect the initial state).
focus-toggles-toolbars = false

# Automatically copy to the clipboard after every annotation change.
auto-copy = false
# Command used for copying, e.g. wl-copy.
copy-command = "wl-copy"
# Exit directly after a copy/save action; a subset of "copy", "save", "save-as" is also supported.
early-exit = ["all"]
# Save the screenshot to a file after copying it to the clipboard.
save-after-copy = false
# Filename for saving; supports chrono strftime specifiers and a leading ~ for the home directory.
# Without a filename, the save-as dialog is used and the chosen file is reused for later saves.
output-filename = "~/Pictures/screenshots/%m.%d.%Y-%H:%M:%S.png"

# Select the tool at startup (see `satty --help` for possible values).
# Since 0.23.0 "brush" paints with a soft edge; the former brush is "pen".
initial-tool = "brush"
# Scale tool sizes (line widths / font sizes) once at startup.
annotation-size-factor = 2
# Adjust history size for brush input smoothing (0 disables it).
brush-smooth-history-size = 10
# Aspect ratios used when holding Shift while drawing box-shaped tools; inverses match too.
aspect-ratios = [[1, 1], [1, 2], [5, 4], [4, 3], [7, 5], [3, 2], [16, 9]]
# Automatically select newly created annotations (0.23.0).
auto-select-new = false

# Actions on right click / Enter / Escape, in order.
# Possible values: save-to-clipboard, save-to-file, save-to-file-as, copy-filepath-to-clipboard, exit.
actions-on-right-click = []
actions-on-enter = ["save-to-clipboard"]
actions-on-escape = ["exit"]

# Disable notifications; since 0.23.0 they are shown as an in-app toast instead of being dropped.
disable-notifications = true
# Show a screenshot thumbnail as the notification icon: "screenshot" or "app-icon".
notification-thumbnail = "screenshot"
# Wait this long (in milliseconds) after sending the thumbnail before exiting.
notification-grace-period = 250

# Experimental pan/zoom settings.
pan-step-size = 50.0
zoom-factor = 1.1
text-move-length = 50.0
# Scale factor of the input image as taken (e.g. monitor DPI); often better set via CLI.
input-scale = 1.0

# Window title and app id (the app id must be a valid D-Bus well-known name).
title = "Satty"
app-id = "org.satty.satty"

# Keyboard shortcuts use the 0.23.0 [keybinds] syntax: "<Control>l" = "line".
# Leaving the section out keeps the upstream defaults; "none" unbinds a key.
# [keybinds]
# "<Control>l" = "line"
# "i" = "none"

# Tool styles (0.23.0). These are the upstream defaults; use [style.TOOL] to override per tool.
[style]
# 1-based index into the palette or a color in RRGGBBAA format.
color = 1
# Size from 0 to 999 with one decimal place; its meaning depends on the tool.
size = 5
# Sizes of the S, M and L buttons and select-size shortcuts.
small = 3
medium = 5
large = 7
# Fill shapes.
fill = false
# Round caps for lines and arrows, rounded corners for rectangles.
round-caps = true
corner-radius = 12
# Opacity in percent, multiplied with the color alpha.
opacity = 100

[style.highlighter]
small = 15
medium = 30
large = 45
opacity = 40

# fill / round-caps select the text effect: none, inverted outline, contrast outline, drop shadow.
# opacity is that of a background in the contrast color; 0 means no background.
[style.text]
small = 36
medium = 54
large = 96
fill = false
round-caps = true
opacity = 0

[style.marker]
small = 36
medium = 54
large = 96

[style.pixelate]
small = 4
medium = 8
large = 16

[style.fringe-pixelate]
small = 4
medium = 8
large = 16

# fill draws a rectangle instead of an ellipse.
[style.blur]
small = 4
medium = 8
large = 16
fill = true

[style.lensblur]
small = 4
medium = 8
large = 16
fill = false

[style.highlight]
small = 40
medium = 60
large = 80
fill = true

[style.spotlight]
small = 40
medium = 60
large = 80
fill = false

[style.blackout]
color = "#000000ff"
fill = true

# Font to use for text annotations.
[font]
family = "sans"
style = "Regular"
# Fallback fonts must be installed; an installed color emoji font is picked up automatically.
fallback = []

# Custom colours for the colour palette.
[color-palette]
# These will be shown in the toolbar for quick selection.
# RRGGBBAA format, where AA is the alpha channel (00 is fully transparent, ff is fully opaque).
palette = [
  "#83a598ff",
  "#fb4934ff",
  "#d3869bff",
  "#fabd2fff",
  "#b8bb26ff",
  "#8ec97cff",
]

# These will be available in the color picker as presets.
# Leave empty to use GTK's default.
custom = []
