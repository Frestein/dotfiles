# ===========================================================================
# M-x
# ===========================================================================

strip_cmd_at=65
# Available values: priority, command_name
sort_commands_by=priority

# ===========================================================================
# Extending Menu
# ===========================================================================

toggle_menu_binding=t
lines_to_show=17
pause_on_open=yes
resume_on_exit=only-if-was-paused

# ---------------------------------------------------------------------------
# Styles
# ---------------------------------------------------------------------------

search_heading=M-x
filter_by_fields=[ "cmd", "key", "comment" ]
column_layout=no
text_color={"default":"b2dbeb","accent":"3449fb","current":"454950","comment":"748392"}
font_size=21
# Cursor 'width', useful to change on HIDPI monitor
cursor_x_border=0.3
line_bottom_margin=1
menu_x_padding=5
menu_y_padding=2
