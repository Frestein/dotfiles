# Shared fzf styling used by fish, bash and yt-x configs.
fzf:
  colors:
    - "fg:#ebdbb2"
    - "fg+:#fbf1c7"
    - "bg:#282828"
    - "bg+:#3c3836"
    - "gutter:#282828"
    - "hl:#458588"
    - "hl+:#458588"
    - "info:#d79921"
    - "marker:#fb4934"
    - "prompt:#fb4934"
    - "spinner:#b8bb26"
    - "pointer:#b16286"
    - "header:#83a598"
    - "border:#928374"
    - "label:#a89984"
    - "query:#d5c4a1"

  common:
    - "--border='sharp'"
    - "--border-label=''"
    - "--prompt='  '"
    - "--marker='+'"
    - "--pointer=''"
    - "--separator='─'"
    - "--scrollbar='│'"
